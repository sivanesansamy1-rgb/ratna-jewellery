<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customers — RATNA Admin</title>
  <link rel="stylesheet" href="/css/admin.css" />
</head>
<body class="admin-body">
  <div class="admin-shell">
    <aside class="admin-sidebar">
      <div class="admin-logo">RATNA<span>.</span> Admin</div>
      <nav class="admin-nav">
        <a href="/admin/dashboard.html">&#9670; Dashboard</a>
        <a href="/admin/products.html">&#9670; Products</a>
        <a href="/admin/categories.html">&#9670; Categories</a>
        <a href="/admin/orders.html">&#9670; Orders</a>
        <a href="/admin/users.html">&#9670; Customers</a>
        <a href="/admin/reviews.html">&#9670; Reviews</a>
        <a href="/admin/coupons.html">&#9670; Coupons</a>
        <a href="/admin/returns.html">&#9670; Returns</a>
      </nav>
    </aside>
    <main class="admin-main">
      <div class="admin-topbar">
        <button class="admin-mobile-toggle" id="admin-mobile-toggle">&#9776;</button>
        <h1>Customers</h1>
        <div class="admin-user"><span id="admin-user-name"></span><button data-admin-logout>Logout</button></div>
      </div>

      <div class="panel">
        <div class="toolbar">
          <input type="search" id="user-search" placeholder="Search by name or email..." style="min-width:280px;"/>
        </div>
        <div class="table-responsive">
<table class="data-table">
          <thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Status</th><th>Joined</th><th>Actions</th></tr></thead>
          <tbody id="users-tbody"><tr class="empty-row"><td colspan="6">Loading...</td></tr></tbody>
        </table>
</div>
      </div>
    </main>
  </div>

  <script src="/js/toast.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
