<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Categories — RATNA Admin</title>
  <link rel="stylesheet" href="/css/admin.css" />
</head>

<body class="admin-body">
  <div class="admin-shell">
    <aside class="admin-sidebar">
      <div class="admin-logo">RATNA<span>.</span> Admin</div>
      <nav class="admin-nav">
        <a href="/admin/dashboard.html">&#9670; Dashboard</a>
        <a href="/admin/products.html">&#9670; Products</a>
        <a href="/admin/categories.html">&#9670; Categories</a>
        <a href="/admin/orders.html">&#9670; Orders</a>
        <a href="/admin/users.html">&#9670; Customers</a>
        <a href="/admin/reviews.html">&#9670; Reviews</a>
        <a href="/admin/coupons.html">&#9670; Coupons</a>
        <a href="/admin/returns.html">&#9670; Returns</a>
      </nav>
    </aside>
    <main class="admin-main">
      <div class="admin-topbar">
        <button class="admin-mobile-toggle" id="admin-mobile-toggle">&#9776;</button>
        <h1>Categories</h1>
        <div class="admin-user"><span id="admin-user-name"></span><button data-admin-logout>Logout</button></div>
      </div>

      <div class="panel">
        <h3 style="margin-top:0;">Add Category</h3>
        <form id="add-category-form" class="a-form-row">
          <div class="a-form-group"><label>Name</label><input name="name" required /></div>
          <div class="a-form-group"><label>Description</label><input name="description" /></div>
          <div class="a-form-group"><label>Image URL</label><input name="image" placeholder="https://..." /></div>
          <div class="a-form-group" style="grid-column:1/-1;"><button class="a-btn primary" type="submit">Add
              Category</button></div>
        </form>
      </div>

      <div class="panel">
        <div class="table-responsive">
<table class="data-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Slug</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="categories-tbody">
            <tr class="empty-row">
              <td colspan="4">Loading...</td>
            </tr>
          </tbody>
        </table>
</div>
      </div>
      
      <div class="modal-overlay hidden" id="category-modal">
        <div class="modal-box">
          <button class="modal-close" id="close-category-modal" onclick="document.getElementById('category-modal').classList.add('hidden')">&times;</button>
          <h3 id="category-modal-title">Edit Category</h3>
          <form id="edit-category-form">
            <input type="hidden" name="id" id="edit-category-id" />
            <div class="a-form-group"><label>Name</label><input name="name" id="edit-category-name" required /></div>
            <div class="a-form-group"><label>Description</label><input name="description" id="edit-category-desc" /></div>
            <div class="a-form-group"><label>Image URL</label><input name="image" id="edit-category-image" placeholder="https://..." /></div>
            <div style="display:flex;gap:10px;margin-top:20px;">
              <button type="button" class="a-btn" onclick="document.getElementById('category-modal').classList.add('hidden')">Cancel</button>
              <button class="a-btn primary" type="submit">Save Changes</button>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/toast.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/admin.js?v=2"></script>
</body>

</html>
