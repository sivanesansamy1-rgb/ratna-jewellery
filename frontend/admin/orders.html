<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orders — RATNA Admin</title>
  <link rel="stylesheet" href="/css/admin.css" />
</head>
<body class="admin-body">
  <div class="admin-shell">
    <aside class="admin-sidebar">
      <div class="admin-logo">RATNA<span>.</span> Admin</div>
      <nav class="admin-nav">
        <a href="/admin/dashboard.html">&#9670; Dashboard</a>
        <a href="/admin/products.html">&#9670; Products</a>
        <a href="/admin/categories.html">&#9670; Categories</a>
        <a href="/admin/orders.html">&#9670; Orders</a>
        <a href="/admin/users.html">&#9670; Customers</a>
        <a href="/admin/reviews.html">&#9670; Reviews</a>
        <a href="/admin/coupons.html">&#9670; Coupons</a>
        <a href="/admin/returns.html">&#9670; Returns</a>
      </nav>
    </aside>
    <main class="admin-main">
      <div class="admin-topbar">
        <button class="admin-mobile-toggle" id="admin-mobile-toggle">&#9776;</button>
        <h1>Orders</h1>
        <div class="admin-user"><span id="admin-user-name"></span><button data-admin-logout>Logout</button></div>
      </div>

      <div class="panel">
        <div class="toolbar">
          <select id="order-status-filter">
            <option value="">All Statuses</option>
            <option>Order Placed</option>
            <option>Payment Confirmed</option>
            <option>Processing</option>
            <option>Packed</option>
            <option>Shipped</option>
            <option>Out for Delivery</option>
            <option>Delivered</option>
            <option>Cancelled</option>
          </select>
        </div>
        <div class="table-responsive">
<table class="data-table">
          <thead><tr><th>Order ID</th><th>Customer</th><th>Items</th><th>Total</th><th>Payment</th><th>Status</th><th>Date</th></tr></thead>
          <tbody id="orders-tbody"><tr class="empty-row"><td colspan="7">Loading...</td></tr></tbody>
        </table>
</div>
      </div>
    </main>
  </div>

  <script src="/js/toast.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
